<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feni Site</title>
    <!-- bibliotecas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- css -->
    <link rel="stylesheet" href="styles/all.css">
    <link rel="stylesheet" href="styles/index/index.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">>:3</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Um Link</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container-fluid p-0 m-0">
        <section id="banner" class="container-fluid" style="height: 400px;"></section>

        <section id="comissionStatus" class="container-fluid d-flex justify-content-center align-items-center">
            <div id="comissionInfo"
                class="container w-75 d-flex flex-column justify-content-center align-items-center my-5 rounded py-3">
                <h1> 🐶 COMMISSION 🐶</h1>
                <h2>CLOSED</h2>
            </div>
        </section>

        <section id="lab" class="infoSection container-fluid row py-3 m-0">
            <aside class="infoImage col-4">
                <img src="images/fotos/fursuit.png" alt="Imagem de uma fursuit" class="w-100 rounded">
            </aside>
            <aside class="infoText col-8 py-3">
                <h3>INFORMAÇÃO MUITO LEGAL</h3>
                <p>BARK BARK BARK</p>
                <button class="btn btn-light">🐾</button>
            </aside>
        </section>

        <section id="quality" class="qualitySection container-fluid row py-3 m-0">
            <aside class="infoText col-8 py-3">
                <h3>OTA INFORMAÇÃO MUITO MAIS MASSA</h3>
                <p>AWOOO</p>
                <button class="btn btn-light">🐾</button>
            </aside>
            <aside class="infoImage col-4">
                <img src="images/gifs/frostTremendo.gif" alt="Imagem de uma fursuit" class="w-100 rounded">
            </aside>
        </section>
    </main>

    <footer class="container-fluid px-4">
        <div class="container-fluid row justify-content-between px-0 py-4 flex-column flex-md-row">

            <div class="col-12 col-md-3 mb-3 mb-md-0 d-flex justify-content-center" id="footer-left">
                <img src="images/gifs/footerGif.gif" class="w-50 w-md-100" alt="gif para o footer">
            </div>

            <div class="col-12 col-md-5 d-flex flex-column align-items-center justify-content-center mb-3 mb-md-0"
                id="footer-center">
                <div id="footerBtns" class="mb-2">
                    <button class="btn rounded"><i class="bi bi-instagram"></i></button>
                    <button class="btn"><i class="bi bi-instagram"></i></button>
                    <button class="btn"><i class="bi bi-instagram"></i></button>
                    <button class="btn"><i class="bi bi-instagram"></i></button>
                </div>
                <div id="footerText">
                    <p class="text-light">BARK BARK BARK.</p>
                </div>
            </div>

            <div class="col-12 col-md-3 d-flex justify-content-md-end justify-content-center" id="footer-right">
                <ul>
                    <li><a href="#" class="text-light">Link</a></li>
                </ul>
            </div>

        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
